name: cdash

services:
  tools:
    build: .
    image: rc-dashboard:local
    init: true
    restart: unless-stopped
    environment:
      CDASH_BIND: 0.0.0.0
      CDASH_AUTH: cf-access
      CDASH_CF_TEAM_DOMAIN: ${CF_TEAM_DOMAIN:?set CF_TEAM_DOMAIN in .env}
      CDASH_CF_AUD: ${CF_AUD:?set CF_AUD in .env}
    volumes:
      # One volume holds every CLI login and ~/.claude.json.
      - home:/home/node
      - ${PROJECTS_DIR:-./projects}:/home/node/projects
    networks: [tunnel]

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN:?set TUNNEL_TOKEN in .env}
    depends_on: [tools]
    networks: [tunnel]

networks:
  tunnel:

volumes:
  home:
