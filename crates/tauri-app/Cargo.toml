[package]
name = "cdash-tauri"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# One destination, http://127.0.0.1:<port>, redirects disabled: no TLS, no h2.
reqwest = { version = "0.13.4", default-features = false, features = ["json"] }
cdash-agent = { path = "../agent" }

# "test" only unifies into dev/test builds; release binaries never see it.
# tokio is here and not above because nothing outside #[tokio::test] uses it —
# tauri brings its own runtime and reqwest brings its own tokio features.
[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
