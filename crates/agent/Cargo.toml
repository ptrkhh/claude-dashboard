[package]
name = "cdash-agent"
version = "0.1.0"
edition = "2021"
rust-version = "1.94.1"

[lib]
name = "cdash_agent"
path = "src/lib.rs"

[[bin]]
name = "cdash-agent"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "=0.38.4"
regex = "1"
rustix = { version = "1", features = ["fs"] }
tokio = { version = "1", features = ["process", "time", "rt", "rt-multi-thread", "macros", "fs", "io-util"] }
time = { version = "0.3", features = ["formatting", "local-offset"] }
