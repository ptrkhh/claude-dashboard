name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: clippy
      - run: cargo test --all --locked
      - run: cargo clippy --all-targets --locked -- -D warnings -D clippy::disallowed_types
