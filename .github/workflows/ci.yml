name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: clippy
      # cdash-tauri links webkit2gtk and libappindicator; ubuntu-latest ships
      # neither, so without this `--all` dies in a build script before a single
      # test runs.
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev
      - run: node --test
      - run: cargo test --all --locked
      - run: cargo clippy --all-targets --locked -- -D warnings -D clippy::disallowed_types

  release-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.1
      # aws-lc-sys needs a musl C cross-compiler, which Ubuntu does not package.
      # This action supplies one and registers a qemu-user runner, replacing a
      # hand-rolled fetch from musl.cc — a host that has since stopped
      # responding and took every release build down with it.
      - uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.target }}
      - run: cargo build --release --locked -p cdash-agent
      # Building is not the gate; booting is. `cargo run` goes through the
      # runner the action registered, so aarch64 executes under qemu here.
      # timeout's 124 means it served until killed, which is the pass — so
      # assert on the banner instead of the exit status.
      - name: Execute the binary
        run: |
          PORT=0 timeout 5 cargo run --release --locked -p cdash-agent > boot.log 2>&1 || true
          cat boot.log
          grep -q "cdash-agent .* on http://127.0.0.1:" boot.log
      - uses: actions/upload-artifact@v4
        with:
          name: cdash-agent-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/cdash-agent

  # The only place Windows code runs: tests, clippy, and two boot gates — the
  # console binary by its banner, the windowless one by a health request,
  # because a GUI-subsystem process has no banner to grep.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: clippy
      # aws-lc-sys assembles with NASM on x86_64-pc-windows-msvc; CMake is on the image.
      - uses: ilammy/setup-nasm@v1
      - run: cargo test -p cdash-agent --locked
      - run: cargo clippy -p cdash-agent --all-targets --locked -- -D warnings -D clippy::disallowed_types
      - run: cargo build --release --locked -p cdash-agent
      - name: Execute the console binary
        shell: pwsh
        run: |
          $env:PORT = '0'
          $p = Start-Process -FilePath target\release\cdash-agent.exe -PassThru -NoNewWindow -RedirectStandardOutput boot.log -RedirectStandardError boot.err
          # A hosted runner can be slow to get a freshly-built exe scanned and
          # running (AV, cold TLS init), so poll the banner instead of a fixed
          # sleep — but the pass condition stays exactly as strict.
          $deadline = (Get-Date).AddSeconds(15)
          $ok = $false
          while ((Get-Date) -lt $deadline) {
            if (Select-String -Path boot.log -Pattern 'cdash-agent .* on http://127.0.0.1:' -Quiet -ErrorAction SilentlyContinue) { $ok = $true; break }
            Start-Sleep -Milliseconds 500
          }
          Stop-Process -Id $p.Id -Force
          Get-Content boot.log, boot.err
          if (-not $ok) { Write-Error "banner not found in boot.log within 15s"; exit 1 }
      - name: Execute the windowless binary
        shell: pwsh
        run: |
          $env:PORT = '18080'
          $p = Start-Process -FilePath target\release\cdash-agentw.exe -PassThru -RedirectStandardOutput bootw.log -RedirectStandardError bootw.err
          $deadline = (Get-Date).AddSeconds(15)
          $body = $null
          while ((Get-Date) -lt $deadline) {
            try { $body = (Invoke-WebRequest -UseBasicParsing http://127.0.0.1:18080/api/health -TimeoutSec 2).Content } catch { $body = $null }
            if ($body -eq '{"ok":true}') { break }
            Start-Sleep -Milliseconds 500
          }
          Stop-Process -Id $p.Id -Force
          Get-Content bootw.log, bootw.err
          if ($body -ne '{"ok":true}') { Write-Error "unexpected health body: $body"; exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: cdash-agent-x86_64-pc-windows-msvc
          path: |
            target/release/cdash-agent.exe
            target/release/cdash-agentw.exe
            public
